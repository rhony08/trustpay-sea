# TrustPay SEA — trustpay.quesitive.com
# Web (Next.js PWA)  127.0.0.1:3011
# API (FastAPI)      127.0.0.1:8010  (paths: /api/, /media/, /docs, /openapi.json)
#
# Install (needs sudo):
#   sudo cp deploy/nginx/trustpay.quesitive.com.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/trustpay.quesitive.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name trustpay.quesitive.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name trustpay.quesitive.com;

    ssl_certificate /etc/nginx/certs/quisitive.pem;
    ssl_certificate_key /etc/nginx/certs/quisitive.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 10M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── API (FastAPI) ──────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location = /openapi.json { proxy_pass http://127.0.0.1:8010; proxy_set_header Host $host; }
    location /docs          { proxy_pass http://127.0.0.1:8010; proxy_set_header Host $host; }
    location /media/        { proxy_pass http://127.0.0.1:8010; proxy_set_header Host $host; }
    location = /healthz     { proxy_pass http://127.0.0.1:8010; proxy_set_header Host $host; }

    # ── Web (Next.js PWA) ──────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/trustpay.quesitive.com.access.log;
    error_log /var/log/nginx/trustpay.quesitive.com.error.log;
}
