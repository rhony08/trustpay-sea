[project]
name = "trustpay-api"
version = "0.1.0"
description = "TrustPay SEA — FastAPI core services"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.9.0",
    "cryptography>=43.0.0",
    "redis>=5.1.0",
    "apscheduler>=3.10.4",
    "email-validator>=2.2.0",
    "opencv-python-headless>=4.10.0,<5",  # 5.0.0 QRCodeEncoder segfaults on macOS arm64
    "numpy>=2.0.0",
    "python-multipart>=0.0.9",
    "google-genai>=1.0.0",  # Vertex AI (GCP provider)
    "openai>=1.50.0",  # OpenRouter (OpenAI-compatible provider)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # Depends() in defaults is the idiomatic FastAPI DI pattern
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.data" = ["banks/*.json"]
