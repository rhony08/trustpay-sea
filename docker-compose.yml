name: trustpay-sea

# Reuses the datastores already running on this host — no new DB/Redis containers:
#   - Postgres: existing `trustpay-sea-postgres-1` (published on host :5432)
#   - Redis:    shared `rr-redis` (remote-reporter), joined via its docker network, DB 2
# `host.docker.internal` needs `extra_hosts: host-gateway` (below).

networks:
  shared:
    external: true
    name: be-remote-reporter_default

volumes:
  trustpay_secrets:

services:
  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trustpay}:${POSTGRES_PASSWORD:-trustpay}@host.docker.internal:5432/${POSTGRES_DB:-trustpay}
      REDIS_URL: redis://rr-redis:6379/2
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      SCHEDULER_ENABLED: "true"
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-https://trustpay.quesitive.com}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - trustpay_secrets:/run/secrets
    ports:
      - "127.0.0.1:8010:8000"
    networks: [default, shared]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        # Baked into the client bundle at build time — the PUBLIC API URL (same origin behind nginx).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://trustpay.quesitive.com}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://trustpay.quesitive.com}
      # Next standalone binds to $HOSTNAME (container id) unless set; force all interfaces
      # so the healthcheck (and host port-map) work.
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:3011:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
